<body data-header="dark"><a class="skip" href="#main">Skip to content</a><header id="site-header"></header><main id="main">
<section class="page-hero"><div class="ph-bg" data-hero="photo-1600566752355-35792bedcfea" data-alt=""></div><div class="container position-relative"><p class="crumb mb-2"><a href="index.html">Home</a> / Contact</p><h1>Start your <em>project</em></h1><p class="mb-2" style="max-width:520px">Tell us about your space and we will be in touch.</p><div class="chips"><span class="chip">Free consultation</span><span class="chip">Reply during studio hours</span></div></div></section>
<section class="sec"><div class="container"><div class="row g-4 align-items-stretch"><div class="col-lg-7"><form id="enquiry" class="form-box h-100" novalidate><span class="eyebrow">Enquiry</span><h2>Tell us about your space</h2><div class="row g-3">
<div class="col-md-6"><label for="name">Name *</label><input class="form-control" id="name" name="name" autocomplete="name" required><span class="err"></span></div>
<div class="col-md-6"><label for="email">Email *</label><input class="form-control" id="email" name="email" type="email" autocomplete="email" required><span class="err"></span></div>
<div class="col-md-6"><label for="phone">Phone *</label><input class="form-control" id="phone" name="phone" type="tel" autocomplete="tel" required><span class="err"></span></div>
<div class="col-md-6"><label for="type">Project type *</label><select class="form-select" id="type" name="type" required><option value="">Select...</option><option>Residential</option><option>Living room</option><option>Bedroom</option><option>Modular kitchen</option><option>Office / Commercial</option><option>Renovation / Styling</option></select><span class="err"></span></div>
<div class="col-12"><label for="budget">Approximate budget</label><select class="form-select" id="budget" name="budget"><option value="">Prefer to discuss</option><option>Under 5 lakh</option><option>5 - 15 lakh</option><option>15 - 30 lakh</option><option>30 lakh +</option></select></div>
<div class="col-12"><label for="message">Message *</label><textarea class="form-control" id="message" name="message" rows="3" required></textarea><span class="err"></span></div>
<div class="col-12"><button class="btn-a magnetic" type="submit">Send enquiry <i class="fa-solid fa-arrow-right"></i></button></div></div><p id="form-note" class="note" role="status" aria-live="polite"></p></form></div>
<div class="col-lg-5"><div class="cwrap"><ul class="info" id="contact-info"></ul><div class="mapbox"><iframe id="map" title="Studio location map" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe></div></div></div></div></div></section>
<script>document.addEventListener("DOMContentLoaded",function(){var S=SITE;document.getElementById("map").src="https://maps.google.com/maps?q="+encodeURIComponent(S.mapQuery)+"&z=13&output=embed";document.getElementById("contact-info").innerHTML='<li><i class="fa-solid fa-phone"></i><a href="tel:'+S.phone.replace(/\s/g,"")+'">'+S.phone+'</a></li><li><i class="fa-solid fa-envelope"></i><a href="mailto:'+S.email+'">'+S.email+'</a></li><li><i class="fa-solid fa-location-dot"></i>'+S.address+'</li><li><i class="fa-solid fa-clock"></i>'+S.hours+'</li>'});</script>
</main><footer id="site-footer"></footer>
